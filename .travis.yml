language: php

php:
  - '8.2'

services:
  - mysql

env:
  global:
    - DB_HOST=127.0.0.1
    - DB_PORT=3306
    - DB_DATABASE=card_free_upgrade_test
    - DB_USERNAME=root
    - DB_PASSWORD=

before_script:
  - mysql -e 'CREATE DATABASE `card_free_upgrade_test` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
  - php composer.phar install --prefer-dist --no-interaction

script:
  - php composer.phar test
  - php composer.phar test:aws
