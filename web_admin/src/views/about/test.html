<template>
  <div class="app-container" :style="{height:appHeight}">
    <div class="square"></div>

    <div class="cover">
      <div class="me"></div>
    </div>

    <div class="style"><p>console: index.css</p>
      <div class="line"></div>
      <style spellcheck="false" class="code"></style>
    </div>
  </div>
</template>

<script>
  export default {
    data () {
      return {
        appHeight: '1024px',
        textHtml: `{<p>Blog:<a>"https://www.shknn.com"</a>,</p>
<p>Email:<a>"bin@shknn.com"</a>,</p>
<p>Weibo:<a>"https://weibo.com/332080458"</a></p>
}`,
        textCss: `.me {
    font-family: monospace;
    font-size: 14px;
    color: #5a666f;
}
.me p {
    margin-left: 40px;
    line-height: 1.4;
}
.me a {
    color: #2d9cd0;
    margin-left: 10px;
}
`,
        htmlLength: 0,
        cssLength: 0,
        dom: {
          me: null,
          code: null,
          style: null,
          line: null
        },
        initOffset: [],
        moveStarted: false
      }
    },
    mounted () {
      this.resizeHandler();
      window.bus.$on('app-resize', this.resizeHandler);
      this.init();
    },
    beforeDestroy () {
      window.bus.$off('app-resize', this.resizeHandler);
    },
    methods: {
      resizeHandler () {
        this.appHeight = window.innerHeight - 50 + 'px';
      },
      init () {
        this.initRequestAnimationFrame();
        this.dom.me = document.querySelector('.me');
        this.dom.code = document.querySelector('.code');
        this.dom.style = document.querySelector('.style');
        this.dom.line = document.querySelector('.line');


        this.showHtml();

        this.dom.style.addEventListener('mousedown', e => {
          if (e.target.tagName === 'P') {
            this.startMove(e)
          }
        });
        this.dom.style.addEventListener('touchstart', this.startMove);

        document.addEventListener('mouseup', () => {
          this.moveStarted = false
        });
        document.addEventListener('touchend', () => {
          this.moveStarted = false
        });
        document.addEventListener('mousemove', _e => {
          _e.preventDefault();
          this.moveListener(_e)
        });
        document.addEventListener('touchmove', _e => {
          _e.preventDefault();
          this.moveListener(_e)
        })
      },
      initRequestAnimationFrame () {
        const browsers = ['webkit', 'moz'];
        for (let i = 0; i < browsers.length && !window.requestAnimationFrame; ++i) {
          window.requestAnimationFrame = window[browsers[i] + 'RequestAnimationFrame']
        }
        if (!window.requestAnimationFrame) {
          let before = 0;
          window.requestAnimationFrame = func => {
            const time = new Date().getTime();
            const delay = Math.max(0, 16 - (time - before));
            const _next = window.setTimeout(() => {
              func(time + delay)
            }, delay);
            before = time + delay;
            return _next
          }
        }
      },
      random (min, max) {
        if (!max) {
          max = min;
          min = 0
        }
        return min + Math.floor(Math.random() * (max - min + 1))
      },
      showHtml () {
        this.dom.me.innerHTML = this.textHtml.substr(0, this.htmlLength) + '<em>|</em>';
        this.htmlLength++;
        if (this.textHtml.length >= this.htmlLength) {
          window.requestAnimationFrame(this.showHtml)
        } else {
          const a_arr = this.dom.me.querySelectorAll('a');
          a_arr[0].setAttribute('target', '_blank');
          a_arr[0].setAttribute('href', 'https://www.shknn.com');
          a_arr[1].setAttribute('target', '_blank');
          a_arr[1].setAttribute('href', 'mailto:bin@shknn.com');
          a_arr[2].setAttribute('target', '_blank');
          a_arr[2].setAttribute('href', 'https://weibo.com/332080458');
          this.dom.style.style.top = this.random(8, 20) + '%';
          this.dom.style.style.right = this.random(6, 18) + '%';
          this.dom.style.style.display = 'block';
          this.showCss()
        }
      },
      showCss () {
        this.dom.code.innerHTML = this.textCss.substr(0, this.cssLength);
        this.cssLength++;
        if (this.textCss.length >= this.cssLength) {
          this.showLineCount();
          window.requestAnimationFrame(this.showCss)
        } else {
          this.dom.code.setAttribute('contenteditable', true);
          this.dom.code.addEventListener('focus', () => {
            this.dom.style.style.background = '#ebeeef'
          });
          this.dom.code.addEventListener('blur', () => {
            this.dom.style.style.background = '#fafafa';
            window.scroll(0, 0)
          });
          this.dom.code.addEventListener('input', () => {
            this.showLineCount()
          })
        }
      },
      showLineCount () {
        const p = (this.dom.code.offsetHeight - 2 * 14) / 16;
        let html = '';
        for (let n = 1; n <= p; n++) {
          html += n + '<br/>'
        }
        this.dom.line.innerHTML = html
      },
      startMove (e) {
        this.moveStarted = true;
        this.initOffset = [this.dom.style.offsetLeft - (e.clientX || e.touches[0].clientX),
          this.dom.style.offsetTop - (e.clientY || e.touches[0].clientY)]
      },
      moveListener (e) {
        if (this.moveStarted) {
          this.dom.style.style.right = 'auto';
          this.dom.style.style.left = ((e.clientX || e.touches[0].clientX) + this.initOffset[0]) + 'px';
          this.dom.style.style.top = ((e.clientY || e.touches[0].clientY) + this.initOffset[1]) + 'px'
        }
      }
    }
  }
</script>
